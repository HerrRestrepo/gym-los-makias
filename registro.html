<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gym los Makias</title>
</head>
<body id="inicio">
      <header>
        <nav>
            <ul class="barra">
                <li><a href="/home.html"><img src="images/logo.png" alt="logo del Gym los Makias"></a></li>
                <li><a href="#ubicacion">Registrarte</a></li>
                <li><a href="/pago.html">Paga tu plan</a></li>
                <li><a href="#planes">!PONTE VIGA!</a></li>
            </ul>
        </nav>
    </header>
    <main class="contenedor-formulario"> 
        <div class="formulario">
            <h2 class="subtitulo">Formulario de registro</h2>
            <form action="/pago.html" method="get">
                <div class="campo-formulario">
                    <label for="tipo-documento">Tipo de documento</label>
                    <select name="tipo-documento" id="tipo-documento" required>
                        <option value="">Tipo de documento</option>
                        <option value="cedula">Cedula</option>
                        <option value="pasaporte">Pasaporte</option>
                        <option value="tarjeda-identidad">Tarjeta Identidad</option>
                    </select>
                    <label for="documento">Numero de Documento</label>
                    <input type="text" id="documento" placeholder="Numero de documento" name="numero_docuemento"
                        required>
                </div>
                <div class="campo-formulario">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre" required name="nombre">
                    <label for="apellido">Apellidos</label>
                    <input type="text" id="apellido" placeholder="Apellidos" required name="apellidos">
                </div>
                <div class="campo-formulario">
                    <label for="telefono-contacto">Número de telefeno</label>
                    <input type="text" id="telefono-contacto" placeholder="+57 000 000 000" required
                        name="telefono-contacto">
                </div>
                <div class="campo-formulario">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" placeholder="Ej: correo@electronico.com" required name="email">
                </div>
                <div class="campo-formulario">
                    <input type="checkbox" id="politica-datos" name="acepta-politicas" value="aceptado" required>
                    <label for="politica-datos">Acepto el tratamiendo de datos</label>
                </div>
                <button type="submit" class="boton-registrarse">Registrarse</button>
                <button type="reset" class="boton-limpiar">Limpiar Formulario</button>
            </form>
        </div>
    </main>
</body>
</html>
